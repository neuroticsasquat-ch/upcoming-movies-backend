services:
  upmovies-backend:
    build:
      context: .
      target: prod
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      TMDB_API_KEY: "${TMDB_API_KEY}"
      # Kept populated even though no stage routes here today: rollback off DeepInfra is then
      # eight Coolify env vars and a restart, with no redeploy and no key to go and find.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      DEEPINFRA_API_KEY: "${DEEPINFRA_API_KEY}"
      # All four stages run on DeepInfra (ADR-0012). The fallbacks below are the production
      # values, not the code defaults — the code still defaults to Anthropic, because that is
      # what a test or a script with no environment should get. Overriding any of these in
      # Coolify is the rollback path, and boot-time validation (NEU-981) refuses an unknown
      # `(provider, model)` pair or a missing credential rather than failing mid-publish.
      #
      # `cluster` is the one stage on the Pro tier. It carries the highest quality bar —
      # ADR-0004, seven jobs in one call — and its failure mode is asymmetric: an over-merge
      # swallows a beat out of the timeline entirely rather than showing something wrong.
      LINK_PROVIDER: "${LINK_PROVIDER:-deepinfra}"
      LINK_MODEL: "${LINK_MODEL:-deepseek-ai/DeepSeek-V4-Flash}"
      CLUSTER_PROVIDER: "${CLUSTER_PROVIDER:-deepinfra}"
      CLUSTER_MODEL: "${CLUSTER_MODEL:-deepseek-ai/DeepSeek-V4-Pro}"
      SOURCE_JUDGE_PROVIDER: "${SOURCE_JUDGE_PROVIDER:-deepinfra}"
      SOURCE_JUDGE_MODEL: "${SOURCE_JUDGE_MODEL:-deepseek-ai/DeepSeek-V4-Flash}"
      SUMMARY_PROVIDER: "${SUMMARY_PROVIDER:-deepinfra}"
      SUMMARY_MODEL: "${SUMMARY_MODEL:-deepseek-ai/DeepSeek-V4-Flash}"
      # `resolve` is the second stage on the Pro tier, for the same asymmetry as `cluster`:
      # it is only asked about mentions the deterministic scorer could not separate — two
      # people TMDB knows by one name (D-22) — and getting that wrong is an alert about
      # somebody who was never in the story. It answers ≤10% of mentions, so the tier costs
      # little; routed here explicitly rather than left on the code default so the whole
      # deployment stays on one provider and one credential.
      RESOLVE_PROVIDER: "${RESOLVE_PROVIDER:-deepinfra}"
      RESOLVE_MODEL: "${RESOLVE_MODEL:-deepseek-ai/DeepSeek-V4-Pro}"
      # Both providers in scope are reasoning models, and reasoning tokens count against the
      # reply ceiling while staying invisible in the returned text. The batch size of 20 was
      # derived from a worst-case *Haiku* reply (config.py), so it is the number most likely to
      # be wrong here: a truncated reply fails to parse and takes every story in the batch with
      # it. Here as a knob so the answer is an env change, and `ingest.llm_call.truncated`
      # (NEU-1014) is what says whether it needs turning.
      LINK_BATCH_SIZE: "${LINK_BATCH_SIZE:-10}"
      LOG_LEVEL: "INFO"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      # BE PUBLIC_BASE_URL must equal the FE public origin (VITE_PUBLIC_SITE_URL / Cloudflare
      # custom domain) — https://backlotter.com in prod — or the sitemap will list URLs on a
      # different host than serves it. DEPLOY CHECKLIST: ensure PUBLIC_BASE_URL is set to
      # https://backlotter.com in the deploy environment (unset = empty string overrides the
      # code default; the fallback below prevents silent misconfiguration).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://backlotter.com}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN}"
      COOKIE_SAMESITE: "lax"
      ENVIRONMENT: "production"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      # healthchecks.io deadman ping URLs for the Coolify scheduled tasks that run
      # `python -m upmovies.pipeline_run daily|hourly|sweep` in this container. Optional —
      # unset makes the ping a no-op (the pipeline still runs). The sweep gets its own check
      # rather than riding the daily one: it runs on its own slot ~2h ahead of daily and is
      # not a stage in that chain, so a sweep that stopped running would leave the daily
      # deadman perfectly green while the catalog quietly stopped moving (ADR-0013, spec §6.1).
      HEALTHCHECK_DAILY_URL: "${HEALTHCHECK_DAILY_URL:-}"
      HEALTHCHECK_HOURLY_URL: "${HEALTHCHECK_HOURLY_URL:-}"
      HEALTHCHECK_SWEEP_URL: "${HEALTHCHECK_SWEEP_URL:-}"
      # Candidate retrieval's T and K. Passed through so tuning them is a Coolify env change
      # rather than a redeploy. The fallbacks repeat the code defaults deliberately, same
      # reason as PUBLIC_BASE_URL above: unset would otherwise pass an empty string and fail
      # to boot. **They are pinned to the code defaults by test**, which keeps a fresh
      # environment seeded correctly — but note what that does *not* cover: Coolify reads
      # each `${NAME:-default}` once, stores a UI entry, and thereafter that entry is what
      # reaches the container. Editing a fallback here does not change a running deployment.
      # NEU-1088's K=35 landed in the code and in this file and prod kept running 25.
      # `LINK_RETRIEVAL_MODE` was retired with the roster path (NEU-1004) — retrieval
      # is now the only link path, and rollback is a revert and redeploy (spec §5.5).
      LINK_RETRIEVAL_THRESHOLD: "${LINK_RETRIEVAL_THRESHOLD:-0.5}"
      # K moved 35 -> 47 at NEU-1135. This line is a **seed, not a runtime default**: Coolify
      # already holds a UI entry for this variable, and the UI entry is what reaches the
      # container, so editing here ships nothing on its own. The deploy is not done until the
      # value is changed in the Coolify UI and confirmed with `printenv` on the running
      # container — see the checklist in `.claude/CLAUDE.md` and §5 of the v0.3.0 runbook.
      # NEU-1088 skipped that step and prod ran the old K for another hour.
      LINK_RETRIEVAL_MAX_CANDIDATES: "${LINK_RETRIEVAL_MAX_CANDIDATES:-47}"
      # The retrieval-health hard breach (NEU-1002): above this zero-candidate rate the link
      # run finalizes `failed`, aborting the daily chain and pinging the deadman. Here for the
      # same reason as T and K — an incident is answered from Coolify env, not a redeploy.
      # 1.0 disarms it; the minimum denominator is what keeps a quiet day from tripping it.
      LINK_RETRIEVAL_MAX_ZERO_CANDIDATE_RATE: "${LINK_RETRIEVAL_MAX_ZERO_CANDIDATE_RATE:-0.10}"
      LINK_RETRIEVAL_HEALTH_MIN_STORIES: "${LINK_RETRIEVAL_HEALTH_MIN_STORIES:-50}"
      # The retrieval-health *soft* breach (NEU-1088): above this cap-saturation rate the run
      # is flagged and says so on its detail line, but still succeeds — saturation is drift,
      # and the daily chain is fail-fast. Reaffirmed at 0.05 by NEU-1135's grid, and still
      # provisional by construction, so expect to turn it from Coolify rather than by a
      # redeploy.
      LINK_RETRIEVAL_SATURATION_WARN_RATE: "${LINK_RETRIEVAL_SATURATION_WARN_RATE:-0.05}"
      # How long an undated film may stay quiescent before it goes dormant (ADR-0015). Here
      # for the same reason as T and K — the M4 tuning ticket sets it from the discovery
      # probe, and that should be a Coolify env change rather than a redeploy. The fallback
      # repeats the code default deliberately: unset would pass an empty string and fail to boot.
      SWEEP_DORMANCY_DAYS: "${SWEEP_DORMANCY_DAYS:-365}"
      # How often the sweep still re-fetches a dormant film. Dormancy is not a one-way door —
      # the change that revives a project can only be seen by reading it, so this is the
      # cadence, not an exemption (ADR-0015, §4.5). Same reasoning as above for being here:
      # M4 tunes it from the probe, and that should be an env change rather than a redeploy.
      SWEEP_DORMANT_REFRESH_DAYS: "${SWEEP_DORMANT_REFRESH_DAYS:-30}"
      # Forward-dwell gate for credit detachment carding (NEU-1205). 0 disables the gate and
      # reverts to plain NEU-1200. The fallback repeats the code default deliberately: unset
      # would pass an empty string and fail to boot. Must be < SWEEP_EVENT_LOOKBACK_DAYS so a
      # held removal is still in the rolling window when it becomes eligible.
      SWEEP_CREDIT_DWELL_DAYS: "${SWEEP_CREDIT_DWELL_DAYS:-3}"
      # The rolling window both carding phases re-read their backlog from (ADR-0014). Seeded
      # here as of NEU-1368, which is what made it operationally load-bearing: the quarantine
      # below is refused at boot unless it fits inside this, so raising the hold means raising
      # this first — and a variable absent from the file at first deploy is one somebody has
      # to add to Coolify by hand, per the gotcha above.
      SWEEP_EVENT_LOOKBACK_DAYS: "${SWEEP_EVENT_LOOKBACK_DAYS:-7}"
      # Attachment quarantine (ADR-0017, D-3, NEU-1368). The other direction of the gate
      # above: an added credit cards only once it has survived this window and is still in
      # `catalog.film_credit`, so a TMDB edit that was never true publishes nothing rather
      # than publishing and needing a correction. 0 disables and reverts to immediate carding.
      # The fallback repeats the code default deliberately: unset would pass an empty string
      # and fail to boot. Must be < SWEEP_EVENT_LOOKBACK_DAYS in hours (7 days = 168) — unlike
      # the dwell gate that constraint is *enforced*, and a value at or above it refuses the
      # boot, because nothing re-reads an attachment that ages out of the window unheld.
      # 72h is a placeholder until the M5 spike reads the knee off `film_credit_change`;
      # retuning it is a Coolify change rather than a redeploy.
      SWEEP_CREDIT_QUARANTINE_HOURS: "${SWEEP_CREDIT_QUARANTINE_HOURS:-72}"
      # Sanity holds (ADR-0017, D-8, NEU-1370). Where quarantine asks whether an edit
      # survived a window, these ask whether it is possible at all, and they judge the
      # *person*: how many films one person may be attached to in a day before the whole run
      # is held as a burst; how long after a recorded death a credit is still ordinary; and
      # the age below which a seed-grade credit is implausible on its face. All three are
      # re-tunable from the Coolify UI, and all three refuse a 0 — unlike the two gates above
      # none has a coherent "off", so turning a check off is a code change. The fallbacks
      # repeat the code defaults deliberately: unset would pass an empty string and fail to
      # boot. 20 / 2 / 3 are placeholders set from the shape of the attacks rather than from
      # measurement; retune once M5 has holds in prod.
      SWEEP_SANITY_MAX_FILMS_PER_DAY: "${SWEEP_SANITY_MAX_FILMS_PER_DAY:-20}"
      SWEEP_SANITY_POSTHUMOUS_YEARS: "${SWEEP_SANITY_POSTHUMOUS_YEARS:-2}"
      SWEEP_SANITY_MIN_AGE_YEARS: "${SWEEP_SANITY_MIN_AGE_YEARS:-3}"
      # Transactional mail (D-30, NEU-1338). Seeded at the code default `noop`, which records
      # and logs every send and transmits nothing, so this lands without a Resend account and
      # without changing what production does. Turning mail on is a Coolify change —
      # MAIL_PROVIDER=resend plus the two below — and boot-time validation then refuses a
      # missing key or an undeliverable MAIL_FROM rather than failing the signup that needed
      # the mail. The lines are here *now* precisely because of the Coolify gotcha above: a
      # `${NAME:-default}` is read once and stored as a UI entry, so a variable that does not
      # exist in the file when the app is first deployed is one somebody has to add by hand.
      MAIL_PROVIDER: "${MAIL_PROVIDER:-noop}"
      MAIL_FROM: "${MAIL_FROM:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # Email verification (NEU-1339). Both repeat the code default rather than being left
      # out, for the Coolify reason above: a variable absent from the file at first deploy is
      # one somebody has to add by hand later, and these are the two a non-production
      # environment most wants to change — PRODUCT_NAME so its mail does not claim to be the
      # live product, and the TTL, which is also the number the mail copy quotes.
      PRODUCT_NAME: "${PRODUCT_NAME:-Backlotter}"
      VERIFY_TOKEN_TTL_HOURS: "${VERIFY_TOKEN_TTL_HOURS:-24}"
      # Password reset (NEU-1340), here for the same reason and deliberately the shorter
      # window: this link sets the password and drops every session.
      RESET_TOKEN_TTL_HOURS: "${RESET_TOKEN_TTL_HOURS:-1}"
      # Email change (NEU-1341), the same short window and for the same reason: spending this
      # link moves the address the account signs in and recovers with.
      EMAIL_CHANGE_TOKEN_TTL_HOURS: "${EMAIL_CHANGE_TOKEN_TTL_HOURS:-1}"
      # Open signup (D-18, NEU-1343). Cloudflare Turnstile's secret key, and the switch that
      # puts the invite requirement back. The secret is seeded **empty** on purpose, unlike
      # every other line here: an unset value refuses signups rather than taking unverified
      # ones, so the window between this landing and the real key going into the Coolify UI
      # (spec §7) costs signups instead of quietly admitting scripts. The line is present for
      # the Coolify gotcha above — a variable absent from the file at first deploy is one
      # somebody has to add by hand.
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      SIGNUP_OPEN: "${SIGNUP_OPEN:-true}"
      # Per-IP rate limiting (D-19, NEU-1344). Every bucket is listed even though the code
      # carries the same defaults, for the Coolify gotcha above: a variable absent at first
      # deploy is one somebody has to add by hand later, and two of these are the knobs an
      # incident is answered with. The strings are `"<capacity>/<refill_per_minute>"`; a
      # malformed one fails the container at boot rather than the route at its first caller.
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      # **Ships false, and this is the rollout order** (spec §5): deploy this, then set
      # SSR_ORIGIN_SECRET here and as a Wrangler secret and deploy the frontend sibling
      # (NEU-1389), and only then flip this to true in the Coolify UI and restart. Flipped
      # before the Worker signs its requests, it throttles the entire server-rendered site
      # through a handful of Cloudflare egress IPs.
      RATE_LIMIT_PUBLIC_ENABLED: "${RATE_LIMIT_PUBLIC_ENABLED:-false}"
      RATE_LIMIT_SIGNUP: "${RATE_LIMIT_SIGNUP:-5/0.083}"
      RATE_LIMIT_LOGIN: "${RATE_LIMIT_LOGIN:-20/1.33}"
      RATE_LIMIT_AUTH_REQUEST: "${RATE_LIMIT_AUTH_REQUEST:-5/0.083}"
      RATE_LIMIT_IMPORT: "${RATE_LIMIT_IMPORT:-6/0.1}"
      RATE_LIMIT_PUBLIC: "${RATE_LIMIT_PUBLIC:-240/120}"
      RATE_LIMIT_ICS: "${RATE_LIMIT_ICS:-30/30}"
      # The secret the SSR Worker signs its API calls with, so it can name the visitor it is
      # rendering for instead of being metered as one caller. Seeded **empty**, like
      # TURNSTILE_SECRET above: unset means the signature header is ignored, never that a
      # signed request is refused, so this deploying ahead of the Worker costs nothing. Must
      # match the Wrangler secret of the same name exactly.
      SSR_ORIGIN_SECRET: "${SSR_ORIGIN_SECRET:-}"
      # Sentry release tag. Coolify exposes the deployed commit as SOURCE_COMMIT; falls
      # back to "unknown" so the SDK still initializes when it's absent (e.g. local prod build).
      GIT_SHA: "${SOURCE_COMMIT:-unknown}"
      # Coolify magic var: routes the assigned domain (api.backlotter.com, set in the
      # Coolify UI) to this service on container port 8000.
      SERVICE_FQDN_UPMOVIESBACKEND_8000: "${SERVICE_FQDN_UPMOVIESBACKEND_8000:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
