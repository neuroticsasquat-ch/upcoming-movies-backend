[project]
name = "upmovies"
version = "0.1.0"
description = "Upcoming Movies Tracker backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.19.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "sentry-sdk[fastapi]>=2.66.1",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-logging",
    "anthropic>=0.120.2",
    "python-slugify>=8.0.4",
    "tldextract>=5.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "httpx>=0.28.1",
    "types-python-slugify>=8.0.2.20240310",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upmovies"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
# ruff 0.16.0 began formatting Python code blocks inside Markdown by default.
# Keep `ruff format` scoped to real source so hand-authored docs aren't rewritten.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/upmovies"]
concurrency = ["thread", "greenlet"]
omit = []
[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
