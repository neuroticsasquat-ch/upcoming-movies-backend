version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    target-branch: updates/dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    target-branch: updates/dependencies
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    ignore:
      # SQLAlchemy 2.1 types Select/Row with TypeVarTuple, which breaks pyright repo-wide
      # (Select[int] vs Select[tuple[int]]). pyproject pins <2.1; drop this once the 2.1
      # typing migration is done on purpose.
      - dependency-name: sqlalchemy
        versions: [">=2.1.0"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
