services:
  upmovies-backend:
    build:
      context: .
      target: dev
    container_name: upmovies_backend
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./htmlcov:/app/htmlcov
    environment:
      DATABASE_URL: "postgresql+asyncpg://root:root@tbc_postgresql_db:5432/upmovies"
      TEST_DATABASE_URL: "postgresql+asyncpg://root:root@tbc_postgresql_db:5432/upmovies_test"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-secret-change-me}"
      TMDB_API_KEY: "${TMDB_API_KEY:-dev-tmdb-key}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-test-anthropic-key}"
      # Optional, and empty by default: the gateway's exit criterion is capability, and
      # production stays on Anthropic for all four stages. Only the offline verification and
      # eval scripts read these, so a deploy without them must keep working (spec §8).
      DEEPINFRA_API_KEY: "${DEEPINFRA_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # Which provider answers each stage. Anthropic everywhere is the shipped configuration
      # and the only one production runs; these are passed through so an eval sweep can move
      # one stage at a time from the repo-root .env without editing this file (NEU-980).
      LINK_PROVIDER: "${LINK_PROVIDER:-anthropic}"
      CLUSTER_PROVIDER: "${CLUSTER_PROVIDER:-anthropic}"
      SOURCE_JUDGE_PROVIDER: "${SOURCE_JUDGE_PROVIDER:-anthropic}"
      SUMMARY_PROVIDER: "${SUMMARY_PROVIDER:-anthropic}"
      LOG_LEVEL: "INFO"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://app.upmovies.localhost}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.upmovies.localhost}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
      # Candidate-retrieval constants — see docker-compose.prod.yml. Passed through so T and
      # K can be swept locally from the repo-root .env without editing this file.
      LINK_RETRIEVAL_THRESHOLD: "${LINK_RETRIEVAL_THRESHOLD:-0.5}"
      LINK_RETRIEVAL_MAX_CANDIDATES: "${LINK_RETRIEVAL_MAX_CANDIDATES:-25}"
      LINK_RETRIEVAL_MAX_ZERO_CANDIDATE_RATE: "${LINK_RETRIEVAL_MAX_ZERO_CANDIDATE_RATE:-0.25}"
      LINK_RETRIEVAL_HEALTH_MIN_STORIES: "${LINK_RETRIEVAL_HEALTH_MIN_STORIES:-50}"
      # The dormancy window (ADR-0015), passed through for the same reason as T and K: it is
      # a placeholder until the M4 tuning ticket measures it, so it has to be sweepable from
      # the repo-root .env without editing this file.
      SWEEP_DORMANCY_DAYS: "${SWEEP_DORMANCY_DAYS:-365}"
      SWEEP_DORMANT_REFRESH_DAYS: "${SWEEP_DORMANT_REFRESH_DAYS:-30}"
      SWEEP_EVENT_LOOKBACK_DAYS: "${SWEEP_EVENT_LOOKBACK_DAYS:-7}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.upmovies-backend.rule=Host(`api.upmovies.localhost`)"
      - "traefik.http.routers.upmovies-backend.tls=true"
      - "traefik.http.routers.upmovies-backend.entrypoints=websecure"
      - "traefik.http.services.upmovies-backend.loadbalancer.server.port=8000"
    command: ["uvicorn", "upmovies.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - proxy

networks:
  proxy:
    external: true
